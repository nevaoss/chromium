name: clang-tidy

on:
  workflow_dispatch:
    inputs:
      PullRequest:
        description: "Pull Request number"
        required: true
        type: string
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: clang-tidy-pr-${{ github.event.issue.number || github.event.pull_request.number || inputs.PullRequest }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: Run clang-tidy review

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.body == '/clang-tidy' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: self-hosted

    steps:
      - name: Validate PR parameters and prepare for manual run
        if: github.event_name == 'workflow_dispatch'
        id: manual_pr
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.PullRequest }}
        run: |
          set -euo pipefail

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Wrong input in the PullRequest field"
            exit 1
          fi

          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Prepare PR parameters for comment run
        if: github.event_name == 'issue_comment'
        id: comment_pr
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Prepare parameters
        id: prepare_params
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: >-
            ${{ steps.manual_pr.outputs.number ||
              steps.comment_pr.outputs.number }}
        run: |
          set -euo pipefail

          read PR_HEAD_SHA CURRENT_BASE_SHA PR_HEAD_REF < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | \
              jq -r '[.head.sha, .base.sha, .head.ref] | @tsv'
          )

          COMPARE_JSON=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${CURRENT_BASE_SHA}...${PR_HEAD_SHA}"
          )

          PR_BASE_SHA=$(
            jq -er '.merge_base_commit.sha' <<< "${COMPARE_JSON}"
          )

          {
            echo "number=${PR_NUMBER}"
            echo "base_sha=${PR_BASE_SHA}"
            echo "head_sha=${PR_HEAD_SHA}"
            echo "head_ref=${PR_HEAD_REF}"
          } >> "${GITHUB_OUTPUT}"

      # Commit status is attached to the PR head commit, so the result is
      # visible on the PR even though the run is triggered manually.
      - name: Report pending status
        uses: nevaoss/ci/.github/actions/commit-status@main
        with:
          context: jenkins/clang-tidy
          label: Jenkins clang-tidy
          state: pending
          sha: ${{ steps.prepare_params.outputs.head_sha }}

      - name: Checkout CI repository
        uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main
          persist-credentials: false

      - name: Run clang-tidy script
        id: clang_tidy
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          GITHUB_PR_BASE_SHA: ${{ steps.prepare_params.outputs.base_sha }}
          GITHUB_PR_HEAD_SHA: ${{ steps.prepare_params.outputs.head_sha }}
          GITHUB_PR_HEAD_REF: ${{ steps.prepare_params.outputs.head_ref }}
          GITHUB_PR_NUMBER: >-
            ${{ steps.manual_pr.outputs.number ||
              steps.comment_pr.outputs.number }}
        run: |
          set -euo pipefail
          
          REVIEW_JSON=$(./tools/clang-tidy.py) || true
          # The diagnostics can exceed the step output size limit, so the
          # posting step reads them from the workspace.
          printf '%s\n' "${REVIEW_JSON}" > clang-tidy-result.json

          STATUS=$(jq -r '.status // empty' <<< "${REVIEW_JSON}")

          if [[ "${STATUS}" != "success" ]]; then
            echo "::error::clang-tidy check was not completed. PR comment will not be added."
            exit 1
          fi

          REVIEW=$(jq -r '.review // empty' <<< "${REVIEW_JSON}")
          # Empty when the Jenkins job does not report the number.
          DIAGNOSTICS=$(jq -r '.diagnostics // empty' <<< "${REVIEW_JSON}")

          case "${DIAGNOSTICS}" in
            "") SUMMARY="see PR comment"
                HEADER="clang-tidy found issues:" ;;
            0)  SUMMARY="no issues"
                HEADER="clang-tidy found no issues." ;;
            1)  SUMMARY="1 issue"
                HEADER="clang-tidy found 1 issue:" ;;
            *)  SUMMARY="${DIAGNOSTICS} issues"
                HEADER="clang-tidy found ${DIAGNOSTICS} issues:" ;;
          esac

          if [[ -z "${REVIEW}" ]]; then
            COMMENT="clang-tidy check completed successfully. No issues found."
          else
            # The review is Markdown with its own code block; wrapping it in
            # another one would break the rendering.
            COMMENT=$(printf '%s\n\n%s\n' "${HEADER}" "${REVIEW}")
          fi

          {
            echo "summary=${SUMMARY}"
            echo "header=${HEADER}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "review<<CLANG_TIDY_REVIEW_EOF"
            printf '%s\n' "${COMMENT}"
            echo "CLANG_TIDY_REVIEW_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Add review comment to Pull Request
        if: steps.clang_tidy.outputs.review != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ steps.prepare_params.outputs.head_sha }}
          PR_NUMBER: ${{ steps.prepare_params.outputs.number }}
          HEADER: ${{ steps.clang_tidy.outputs.header }}
          REVIEW: ${{ steps.clang_tidy.outputs.review }}
        run: |
          set -euo pipefail

          CURRENT_HEAD_SHA=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.sha'
          )

          if [[ "${CURRENT_HEAD_SHA}" != "${PR_HEAD_SHA}" ]]; then
            echo "Pull Request was updated. Obsolete result will not be posted."
            exit 0
          fi

          # Each entry of .comments is {path, line, message}, with the path
          # relative to the repository root. Results without .comments come
          # from a Jenkins job that only reports the Markdown review.
          if jq -e '(.comments // []) | length > 0' \
              clang-tidy-result.json > /dev/null; then
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | {filename, patch}' > pr-files.jsonl

            # GitHub rejects a whole review if one comment is on a line
            # outside the diff. Such diagnostics become file-level threads,
            # or go in the review body when the file is not in the PR.
            python3 - <<'PY'
          import json
          import os
          import re

          HUNK = re.compile(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@')

          def commentable_lines(patch):
              lines = set()
              line = 0
              for text in patch.splitlines():
                  match = HUNK.match(text)
                  if match:
                      line = int(match.group(1))
                  elif text.startswith(('-', '\\')):
                      continue
                  else:
                      lines.add(line)
                      line += 1
              return lines

          files = {}
          with open('pr-files.jsonl') as f:
              for entry in map(json.loads, f):
                  files[entry['filename']] = commentable_lines(
                      entry.get('patch') or '')

          with open('clang-tidy-result.json') as f:
              diagnostics = json.load(f)['comments']

          line_comments = []
          file_comments = []
          unplaced = []
          for d in diagnostics:
              path, line = d['path'], int(d['line'])
              body = '```\n' + d['message'].rstrip() + '\n```'
              if line in files.get(path, ()):
                  line_comments.append(
                      {'path': path, 'line': line, 'side': 'RIGHT',
                       'body': body})
              elif path in files:
                  file_comments.append(
                      {'path': path, 'subject_type': 'file',
                       'commit_id': os.environ['PR_HEAD_SHA'],
                       'body': f'Line {line}:\n\n{body}'})
              else:
                  unplaced.append(f'`{path}:{line}`\n\n{body}')

          review_body = '\n\n'.join([os.environ['HEADER']] + unplaced)
          with open('review.json', 'w') as f:
              json.dump({'commit_id': os.environ['PR_HEAD_SHA'],
                         'event': 'COMMENT',
                         'body': review_body,
                         'comments': line_comments}, f)
          with open('file-comments.jsonl', 'w') as f:
              for comment in file_comments:
                  f.write(json.dumps(comment) + '\n')
          PY

            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --input review.json > /dev/null

            while IFS= read -r comment; do
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" \
                --input - <<< "${comment}" > /dev/null
            done < file-comments.jsonl
            exit 0
          fi

          printf '%s\n' "${REVIEW}" > clang-tidy-review.md
          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file clang-tidy-review.md

      - name: Report final status
        if: always() && steps.prepare_params.outputs.head_sha != ''
        uses: nevaoss/ci/.github/actions/commit-status@main
        with:
          context: jenkins/clang-tidy
          label: Jenkins clang-tidy
          state: ${{ job.status }}
          build: ${{ steps.clang_tidy.outputs.jenkins_build }}
          sha: ${{ steps.prepare_params.outputs.head_sha }}
          success-text: completed, ${{ steps.clang_tidy.outputs.summary || 'see PR comment' }}
          failure-text: did not complete
