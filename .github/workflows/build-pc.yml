name: build-pc

on:
  workflow_dispatch:
  pull_request:
    branches-ignore:
      - 'doc/**'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: build-pc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-pc
    runs-on: self-hosted
    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main
      - name: Run PC builder
        run: |
          exec ./build-pc.py
