name: test-pc-bvt

on:
  # discussion_comment:
  # issue_comment:
  # pull_request_review_comment:
  # pull_request_review:
  # pull_request:
  workflow_dispatch:

jobs:
  test-pc-bvt:
    name: BVT tests for PC build
    if: >-
      github.ref_name != 'neva-main-rolling' &&
      (!startsWith(github.ref_name, 'rolling/') ||
      endsWith(github.ref_name, '/merge-rolling-in-main'))
    runs-on: self-hosted

    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - name: Check out CI repository
        uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main

      - name: Run BVT tests for PC target
        run: ./test-pc-bvt.py

  rolling-test-pc-bvt:
    name: BVT tests for rolling PC build
    if: >-
      (github.ref_name == 'neva-main-rolling' ||
      startsWith(github.ref_name, 'rolling/')) &&
      !endsWith(github.ref_name, '/merge-rolling-in-main')
    runs-on: self-hosted

    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - name: Check out CI repository
        uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main

      - name: Run BVT tests for rolling PC target
        run: ./rolling/test-pc-bvt.py