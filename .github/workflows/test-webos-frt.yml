name: test-webos-frt

on:
  # discussion_comment:
  # issue_comment:
  # pull_request_review_comment:
  # pull_request_review:
  # pull_request:
  workflow_dispatch:

jobs:
  test-webos-frt:
    name: FRT tests for webOS build
    if: >-
      github.ref_name != 'neva-main-rolling' &&
      (!startsWith(github.ref_name, 'rolling/') ||
      endsWith(github.ref_name, '/merge-rolling-in-main'))
    runs-on: self-hosted

    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - name: Check out CI repository
        uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main

      - name: Run FRT tests for webOS/OSE target
        run: ./test-webos-frt.py

  rolling-test-webos-frt:
    name: FRT tests for rolling webOS build
    if: >-
      (github.ref_name == 'neva-main-rolling' ||
      startsWith(github.ref_name, 'rolling/')) &&
      !endsWith(github.ref_name, '/merge-rolling-in-main')
    runs-on: self-hosted

    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - name: Check out CI repository
        uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main

      - name: Run FRT tests for rolling webOS/OSE target
        run: ./rolling/test-webos-frt.py