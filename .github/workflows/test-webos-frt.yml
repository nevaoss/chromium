name: test-webos-frt

on:
  # discussion_comment:
  # issue_comment:
  # pull_request_review_comment:
  # pull_request_review:
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# Both jobs report as jenkins/test-webos-frt, so the PR shows one status
# whether the regular or the rolling tests ran.
jobs:
  test-webos-frt:
    name: FRT tests for webOS build
    if: >-
      github.ref_name != 'neva-main-rolling' &&
      (!startsWith(github.ref_name, 'rolling/') ||
      endsWith(github.ref_name, '/merge-rolling-in-main'))
    runs-on: self-hosted

    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - name: Report pending status
        uses: nevaoss/ci/.github/actions/commit-status@main
        with:
          context: jenkins/test-webos-frt
          label: Jenkins webOS FRT
          state: pending

      - name: Check out CI repository
        uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main

      - name: Run FRT tests for webOS/OSE target
        id: jenkins
        shell: bash
        run: ./test-webos-frt.py

      - name: Report final status
        if: always()
        uses: nevaoss/ci/.github/actions/commit-status@main
        with:
          context: jenkins/test-webos-frt
          label: Jenkins webOS FRT
          state: ${{ job.status }}
          build: ${{ steps.jenkins.outputs.jenkins_build }}

  rolling-test-webos-frt:
    name: FRT tests for rolling webOS build
    if: >-
      (github.ref_name == 'neva-main-rolling' ||
      startsWith(github.ref_name, 'rolling/')) &&
      !endsWith(github.ref_name, '/merge-rolling-in-main')
    runs-on: self-hosted

    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - name: Report pending status
        uses: nevaoss/ci/.github/actions/commit-status@main
        with:
          context: jenkins/test-webos-frt
          label: Jenkins rolling webOS FRT
          state: pending

      - name: Check out CI repository
        uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main

      - name: Run FRT tests for rolling webOS/OSE target
        id: jenkins
        shell: bash
        run: ./rolling/test-webos-frt.py

      - name: Report final status
        if: always()
        uses: nevaoss/ci/.github/actions/commit-status@main
        with:
          context: jenkins/test-webos-frt
          label: Jenkins rolling webOS FRT
          state: ${{ job.status }}
          build: ${{ steps.jenkins.outputs.jenkins_build }}
