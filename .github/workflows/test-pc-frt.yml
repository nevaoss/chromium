name: test-pc-frt

on:
  # discussion_comment:
  # issue_comment:
  # pull_request_review_comment:
  # pull_request_review:
  # pull_request:
  workflow_dispatch:
  
jobs:
  test-pc-frt:
    name: test-pc-frt
    if: ${{ ! startsWith(github.ref_name, 'rolling/')
            && github.ref_name != 'neva-main-rolling' }}
    runs-on: self-hosted
    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main
      - name: Run FRT tests for PC target
        run: |
          ./test-pc-frt.py

  rolling-test-pc-frt:
    name: rolling-test-pc-frt
    if: ${{ startsWith(github.ref_name, 'rolling/')
            || githib.ref_name == 'neva-main-rolling' }}
    runs-on: self-hosted
    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: nevaoss/ci
          ref: main
      - name: Run FRT tests for PC target
        run: |
          ./rolling/test-pc-frt.py
